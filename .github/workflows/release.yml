name: release

# 打 tag（v1.0.0 这种）→ 自动构建 Windows 发行包并发布 Release
# 手动运行（Actions → release → Run workflow）→ 只构建并留 artifact，不发布
#
# 说明：CI 的 Windows runner 没有桌面，Tk() 建不了窗。main.py 的 --selftest
# 在这种情况下会自动退回「只验 tcl/tk 数据」（headless），所以门禁依然有效。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-x64:
    name: Windows x64 发行包
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: 取源码
        uses: actions/checkout@v4
        with:
          # pack_release.py 要把 git 提交号写进 MANIFEST，需要完整历史
          fetch-depth: 0

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          # 与本地开发一致；setup-python 提供的 CPython 自带 tkinter/tcl-tk
          python-version: "3.14"

      - name: 环境体检（结果写进 annotation，失败时也能看到）
        shell: pwsh
        run: |
          $py = & python -c "import sys;print('Python ' + sys.version.split()[0])"
          $tk = & python -c "import tkinter;print(tkinter.TkVersion)" 2>$null
          if ($LASTEXITCODE -ne 0) { $tk = 'MISSING' }
          $tcl = & python -c "import tkinter;print(tkinter.Tcl().eval('info patchlevel'))" 2>$null
          if ($LASTEXITCODE -ne 0) { $tcl = 'FAIL' }
          $win = & python -c "import tkinter;tkinter.Tk().destroy();print('ok')" 2>$null
          if ($LASTEXITCODE -ne 0) { $win = 'FAIL' }
          "python : $py"
          "tkinter: $tk   Tcl: $tcl   建窗: $win"
          Write-Host "::warning title=env::py=$py | tkinter=$tk | Tcl=$tcl | Tk=$win"

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pillow

      - name: 版本一致性检查（tag 与 constants.VERSION 必须一致）
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $src = Get-Content 'pwer/constants.py' -Raw -Encoding UTF8
          $m = [regex]::Match($src, '^VERSION\s*=\s*"([^"]+)"', 'Multiline')
          if (-not $m.Success) { throw 'pwer/constants.py 里没找到 VERSION' }
          $ver = $m.Groups[1].Value
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          "tag=$tag  VERSION=$ver"
          if ($ver -ne $tag) {
            throw "标签 ${{ github.ref_name }} 与 VERSION=$ver 不一致，先改 constants.py 再打 tag"
          }

      - name: 打包（含产物自检门禁 + MANIFEST + zip）
        shell: cmd
        run: build.bat > build.log 2>&1

      - name: 打印构建日志（失败也执行）
        if: always()
        shell: pwsh
        run: |
          if (Test-Path build.log) {
            Get-Content build.log -Encoding UTF8
          } else {
            Write-Host '（没有 build.log，build.bat 可能没跑起来）'
            Write-Host "::error title=build::没有生成 build.log"
          }

      - name: 回显产物自检结果（失败也执行）
        if: always()
        shell: pwsh
        run: |
          $log = 'dist/电力公司/selftest.log'
          if (-not (Test-Path $log)) {
            Write-Host "::error title=selftest::没有 selftest.log，构建可能没走到打包那步"
            exit 0
          }
          Get-Content $log -Encoding UTF8
          if (Select-String -Path $log -Pattern '自检通过' -Quiet) {
            Write-Host "::notice title=selftest::产物自检通过"
          } else {
            $tail = ((Get-Content $log -Tail 12 -Encoding UTF8) -join '%0A')
            Write-Host "::error title=selftest::产物自检没通过 —— $tail"
          }

      - name: 汇总
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path 'release')) { exit 0 }
          $zip = Get-ChildItem 'release/*.zip' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $zip) { exit 0 }
          $sha = Get-FileHash $zip.FullName -Algorithm SHA256
          $manifest = Get-Content 'dist/电力公司/MANIFEST.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          @(
            "### 发行包",
            "",
            "| 项 | 值 |",
            "| --- | --- |",
            "| 文件 | ``$($zip.Name)`` |",
            "| 大小 | $('{0:N2}' -f ($zip.Length / 1MB)) MB |",
            "| SHA-256 | ``$($sha.Hash.ToLower())`` |",
            "| 版本 | v$($manifest.version) · BUILD $($manifest.build) |",
            "| 源码 | $($manifest.gitRev)（dirty=$($manifest.gitDirty)） |",
            "| 文件数 | $($manifest.fileCount) |"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          Write-Host "::notice title=artifact::$($zip.Name) $('{0:N2}' -f ($zip.Length/1MB))MB sha256=$($sha.Hash.ToLower())"

      - name: 上传构建产物（失败也执行）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pwer-windows-x64
          if-no-files-found: warn
          retention-days: 30
          path: |
            release/*.zip
            release/*.sha256
            dist/电力公司/MANIFEST.json
            dist/电力公司/selftest.log
            build.log

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/') && success()
        uses: softprops/action-gh-release@v2
        with:
          name: "电力公司 ${{ github.ref_name }}"
          files: |
            release/*.zip
            release/*.sha256
          generate_release_notes: true
          body: |
            《电力公司》Windows x64 绿色版，解压即玩。

            下载下面的 `电力公司-*-win64.zip`，解压后双击 `电力公司.exe`。

            首次运行可能被 SmartScreen 拦一下：点「更多信息」→「仍要运行」，
            或右键 exe → 属性 → 勾选「解除锁定」。原因是没有购买代码签名证书，
            包内 `绿色小游戏告知.txt` 有详细说明。

            校验：`电力公司-*-win64.zip.sha256` 里是 zip 的 SHA-256；
            解压后目录里的 `MANIFEST.json` 记录了每个文件的哈希。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
